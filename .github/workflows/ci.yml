name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: analyzers/csharp/global.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18
      # The oldest Python the analyzer supports (D-057): conformance and the report run on it.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      # The oldest JDK the analyzer supports (D-058): its tests and conformance run on it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The oldest Ruby the analyzer supports (D-061), without gems: Prism comes with it.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: none
      - name: Contracts, spec/rules and cases
        working-directory: conformance/runner
        run: |
          npm ci
          npm run validate
          npm test
          npm run selftest
          npm run typecheck
      - name: Analyzer C#
        working-directory: analyzers/csharp
        run: |
          dotnet build Nomos.slnx
          dotnet test Nomos.slnx --no-build
      - name: Analyzer Go
        working-directory: analyzers/go
        run: |
          go vet ./...
          go test ./...
      - name: Analyzer TypeScript and JavaScript
        working-directory: analyzers/typescript
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Analyzer Python
        working-directory: analyzers/python
        run: python -I -m unittest discover -s tests -v
      - name: Analyzer Java
        working-directory: analyzers/java
        run: node run.mjs --test
      # The Kotlin compiler jars come from Maven Central at the versions and hashes of deps.json (D-059).
      - name: Analyzer Kotlin
        working-directory: analyzers/kotlin
        run: |
          node run.mjs --fetch
          node run.mjs --test
      - name: Analyzer Ruby
        working-directory: analyzers/ruby
        run: node run.mjs --test
      - name: Conformance and parity
        working-directory: conformance/runner
        run: npm run all
      - name: CI runner
        working-directory: ci
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Report on this repository
        run: node ci/src/cli.ts --workspace nomos.json --out .nomos
      - uses: actions/upload-artifact@v4
        with:
          name: nomos-report
          path: .nomos/
          # .nomos is a hidden folder, which upload-artifact skips by default since 4.4.
          include-hidden-files: true
      - name: Extension
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run check-boundary
          npm run check-l10n
