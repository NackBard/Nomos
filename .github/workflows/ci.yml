name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reading the code is all the jobs need; the token of a pull request can change nothing (D-069).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: analyzers/csharp/global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
      # The oldest Python the analyzer supports (D-057): conformance and the report run on it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      # The oldest JDK the analyzer supports (D-058): its tests and conformance run on it.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # The oldest Ruby the analyzer supports (D-061), without gems: Prism comes with it.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler: none
      - name: Contracts, spec/rules and cases
        working-directory: conformance/runner
        run: |
          npm ci
          npm run validate
          npm test
          npm run selftest
          npm run typecheck
      - name: Analyzer C#
        working-directory: analyzers/csharp
        run: |
          dotnet build Nomos.slnx
          dotnet test Nomos.slnx --no-build
      - name: Analyzer Go
        working-directory: analyzers/go
        run: |
          go vet ./...
          go test ./...
      - name: Analyzer TypeScript and JavaScript
        working-directory: analyzers/typescript
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Analyzer Python
        working-directory: analyzers/python
        run: python -I -m unittest discover -s tests -v
      - name: Analyzer Java
        working-directory: analyzers/java
        run: node run.mjs --test
      # The Kotlin compiler jars come from Maven Central at the versions and hashes of deps.json (D-059).
      - name: Analyzer Kotlin
        working-directory: analyzers/kotlin
        run: |
          node run.mjs --fetch
          node run.mjs --test
      - name: Analyzer Ruby
        working-directory: analyzers/ruby
        run: node run.mjs --test
      - name: Conformance and parity
        working-directory: conformance/runner
        run: npm run all
      - name: CI runner
        working-directory: ci
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Report on this repository
        run: node ci/src/cli.ts --workspace nomos.json --out .nomos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nomos-report
          path: .nomos/
          # .nomos is a hidden folder, which upload-artifact skips by default since 4.4.
          include-hidden-files: true
      - name: Extension
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run check-boundary
          npm run check-l10n
      # D-046: a real VS Code on a folder without nomos.json with files of every language, analyzed by the analyzers of
      # the core's bundle; the C# runtime comes from the .NET Install Tool, installed into the test profile. VS Code is the
      # latest stable archive; its Chromium sandbox needs user namespaces, which AppArmor on Ubuntu 24 restricts.
      - name: Extension e2e without nomos.json
        working-directory: extension
        run: |
          npm run package -- --bundle-only
          curl -fsSL -o "$RUNNER_TEMP/vscode.tar.gz" https://update.code.visualstudio.com/latest/linux-x64/stable
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cp -r ../conformance/cases/metrics-basic "$RUNNER_TEMP/sample"
          PATH="$RUNNER_TEMP/VSCode-linux-x64/bin:$PATH" VSCODE_EXE="$RUNNER_TEMP/VSCode-linux-x64/code" xvfb-run -a npm run e2e -- "$RUNNER_TEMP/sample"
      # D-063: the agents extension and the MCP server; their tests need git, which the runner has.
      - name: Agents and MCP server
        working-directory: agents
        run: |
          npm ci
          npm test
