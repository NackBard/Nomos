schemaVersion: "1.0.0"
rules:
  - { id: PAT001, category: Patterns, title: Singleton, description: "A class with only private constructors that exposes a static instance of itself.", rationale: "Informational: recognizes the pattern; hidden global state is a cost.", paradigms: [oop], severity: info, confidence: medium, threshold: {} }
  - { id: PAT002, category: Patterns, title: Factory, description: "A method that returns an abstraction and creates several of its concrete subtypes.", rationale: "Informational: recognizes the pattern.", paradigms: [oop], severity: info, confidence: medium, threshold: {} }
  - { id: PAT003, category: Patterns, title: Strategy, description: "A context class that receives one of several interchangeable implementations and delegates to it.", rationale: "Informational: recognizes the pattern.", paradigms: [oop], severity: info, confidence: low, threshold: {} }
  - { id: PAT004, category: Patterns, title: Observer, description: "A type with events it raises, or a list of observers it notifies in a loop, with subscribe methods.", rationale: "Informational: recognizes the pattern.", paradigms: [oop], severity: info, confidence: medium, threshold: {} }
  - { id: PAT005, category: Patterns, title: Decorator, description: "A class that implements an abstraction, wraps an instance of the same abstraction and forwards to it.", rationale: "Informational: recognizes the pattern.", paradigms: [oop], severity: info, confidence: medium, threshold: {} }
  - { id: PAT006, category: Patterns, title: Repository, description: "A type named *Repository, or a collection-like API of get, add and remove over one entity.", rationale: "Informational: recognizes the pattern.", paradigms: [oop], severity: info, confidence: low, threshold: {} }
  - { id: PAT007, category: Patterns, title: Builder, description: "Fluent methods that return the type itself plus a terminal Build-like method.", rationale: "Informational: recognizes the pattern.", paradigms: [oop], severity: info, confidence: medium, threshold: {} }
  - { id: PAT101, category: Patterns, title: Service Locator, description: "Resolving dependencies from a container inside business code.", rationale: "Hides dependencies from the constructor.", paradigms: [oop], severity: minor, confidence: low, threshold: { compositionRootSuffixes: [Program, Startup, Factory, Module, Registry, Extensions] } }
  - { id: PAT102, category: Patterns, title: Anemic Domain Model, description: "A domain-named class with settable data and no behavior, while logic lives in services.", rationale: "Behavior is separated from the data it belongs to.", paradigms: [oop], severity: minor, confidence: low, threshold: { minProperties: 3, domainNamespaces: [Domain, Model, Entities] } }
  - { id: PAT103, category: Patterns, title: Middle Man, description: "A class that does almost nothing but forward to one collaborator, without a shared abstraction.", rationale: "An extra hop with no value of its own.", paradigms: [oop], severity: minor, confidence: low, threshold: { minMethods: 3 } }
