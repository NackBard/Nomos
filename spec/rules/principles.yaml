# Shared rules, category Principles. Validated by contracts/rule.schema.json.
# threshold = sensitivity at which a detector emits a result; the raw measurement is always in facts.
schemaVersion: "1.1.0"
rules:
  - id: PRN001
    category: Principles
    title: Single Responsibility
    description: Counts constructor dependencies of a class and the project modules it reaches into.
    rationale: A class with many collaborators likely has several reasons to change.
    paradigms: [oop]
    severity: major
    confidence: medium
    threshold: { maxConstructorDependencies: 5, maxModules: 4, minMethods: 3 }
    l10n:
      ru:
        title: "Единственная ответственность (Single Responsibility)"
        description: "Считает зависимости конструктора класса и модули проекта, к которым он обращается."
        rationale: "У класса с множеством соисполнителей, вероятно, несколько причин для изменения."
    messages:
      constructor: { text: "{0} takes {1} dependencies in its constructor", ru: "{0} принимает в конструкторе {1} {1|зависимость|зависимости|зависимостей}" }
      injected: { text: "More than {0} injected collaborators usually mean several responsibilities live in one class.", ru: "Если внедрённых зависимостей больше {0}, в одном классе обычно живут несколько обязанностей." }
      modules: { text: "{0} depends on {1} other modules", ru: "{0} зависит от {1} {1|другого модуля|других модулей|других модулей}" }
      concerns: { text: "Reaching into more than {0} modules suggests the class coordinates unrelated concerns.", ru: "Обращение больше чем к {0} {0|модулю|модулям|модулям} говорит о том, что класс координирует несвязанные задачи." }
  - id: PRN002
    category: Principles
    title: Open/Closed
    description: Finds the same enum or tag switched on in several places.
    rationale: Adding a value then means editing every switch.
    paradigms: [oop]
    severity: minor
    confidence: medium
    threshold: { minOccurrences: 2, minCases: 3 }
    l10n:
      ru:
        title: "Открытость/закрытость (Open/Closed)"
        description: "Находит один и тот же enum или признак, по которому делается switch в нескольких местах."
        rationale: "Тогда новое значение требует правки каждого switch."
    messages:
      repeats: { text: "Switch over {0} repeats at {1} sites", ru: "Switch по {0} повторяется в {1} {1|месте|местах|местах}" }
      table: { text: "{0} switches dispatch on {1}; a new value needs an edit at each. A polymorphic type or a table keeps this closed for modification.", ru: "{0} {0|switch выбирает|switch выбирают|switch выбирают} по {1}; новое значение требует правки в каждом. Полиморфный тип или таблица оставляют код закрытым для изменений." }
  - id: PRN003
    category: Principles
    title: Liskov Substitution
    description: An override or implementation whose body only throws not-supported or not-implemented.
    rationale: Such a member cannot stand in for its base type.
    paradigms: [oop]
    severity: major
    confidence: medium
    threshold: {}
    l10n:
      ru:
        title: "Подстановка Лисков (Liskov Substitution)"
        description: "Переопределение или реализация, тело которой только бросает «не поддерживается» или «не реализовано»."
        rationale: "Такой член не может заменить свой базовый тип."
    messages:
      rejects: { text: "{0} rejects the inherited contract", ru: "{0} отвергает унаследованный контракт" }
      throws: { text: "The member exists only to throw, so code written against the base type breaks when it receives this subtype.", ru: "Член существует только чтобы бросить исключение, поэтому код, написанный для базового типа, ломается, получив этот подтип." }
  - id: PRN004
    category: Principles
    title: Interface Segregation
    description: Interfaces with many members, or whose implementers stub some of them.
    rationale: Clients are forced to depend on members they do not use.
    paradigms: [oop]
    severity: minor
    confidence: medium
    threshold: { maxMembers: 10 }
    l10n:
      ru:
        title: "Разделение интерфейсов (Interface Segregation)"
        description: "Интерфейсы с множеством членов или такие, у которых реализации делают часть членов заглушками."
        rationale: "Клиентов заставляют зависеть от членов, которыми они не пользуются."
    messages:
      refused: { text: "{0} has members its implementers refuse", ru: "У {0} есть члены, от которых отказываются реализации" }
      onlyThrow: { text: "Implementers only throw in: {0}. The interface is wider than some clients need.", ru: "Реализации только бросают исключение в: {0}. Интерфейс шире, чем нужно некоторым клиентам." }
      wide: { text: "{0} declares {1} members", ru: "{0} объявляет {1} {1|член|члена|членов}" }
      roles: { text: "More than {0} members on one interface usually mix several client roles.", ru: "Больше {0} {0|члена|членов|членов} в одном интерфейсе обычно смешивают несколько ролей клиентов." }
  - id: PRN005
    category: Principles
    title: Dependency Inversion
    description: Creating a project class that implements a project abstraction, outside composition roots and test classes (a class with test-framework attributes such as Fact, Theory, Test, TestMethod, TestCase).
    rationale: The caller is bound to the concrete type.
    paradigms: [oop]
    severity: minor
    confidence: medium
    threshold: { compositionRootSuffixes: [Factory, Builder, Program, Startup, Module, Registry, Tests] }
    l10n:
      ru:
        title: "Инверсия зависимостей (Dependency Inversion)"
        description: "Создание класса проекта, который реализует абстракцию проекта, вне корней композиции и тестовых классов (класс с атрибутами тестового фреймворка вроде Fact, Theory, Test, TestMethod, TestCase)."
        rationale: "Вызывающий привязан к конкретному типу."
    messages:
      creates: { text: "{0} creates {1} directly", ru: "{0} создаёт {1} напрямую" }
      inject: { text: "{0} is available through {1}, but {2} instantiates the concrete class. Injecting the abstraction keeps {3} replaceable and testable.", ru: "{0} доступен через {1}, но {2} создаёт конкретный класс. Внедрение абстракции оставляет {3} заменяемым и тестируемым." }
  - id: PRN006
    category: Principles
    title: Do not repeat yourself
    description: Callables whose structure is identical up to local names and literals.
    rationale: One piece of knowledge is encoded twice.
    paradigms: []
    severity: minor
    confidence: medium
    threshold: { minNodes: 25 }
    l10n:
      ru:
        title: "Не повторяйся (DRY)"
        description: "Функции, структура которых совпадает с точностью до имён локальных переменных и литералов."
        rationale: "Одно и то же знание записано дважды."
    messages:
      duplicates: { text: "{0} has {1} structural duplicate(s)", ru: "У {0} {1} {1|структурный дубликат|структурных дубликата|структурных дубликатов}" }
      same: { text: "Same statement structure and member usage, differing at most in local names and literals: {0}.", ru: "Та же структура операторов и то же использование членов, отличия — не больше чем в именах локальных переменных и литералах: {0}." }
  - id: PRN007
    category: Principles
    title: Keep it simple
    description: Long boolean conditions and nested ternaries.
    rationale: Too many decisions are packed into one expression.
    paradigms: []
    severity: minor
    confidence: medium
    threshold: { maxBooleanOperators: 3 }
    l10n:
      ru:
        title: "Делай проще (KISS)"
        description: "Длинные логические условия и вложенные тернарные операторы."
        rationale: "В одно выражение упаковано слишком много решений."
    messages:
      operators: { text: "Condition combines {0} boolean operators", ru: "Условие объединяет {0} {0|логический оператор|логических оператора|логических операторов}" }
      intent: { text: "More than {0} operators in one condition; named intermediate values or a predicate method would state the intent.", ru: "Больше {0} {0|оператора|операторов|операторов} в одном условии; именованные промежуточные значения или метод-предикат выразили бы намерение." }
      ternary: { text: "Nested ternary expression", ru: "Вложенный тернарный оператор" }
      branching: { text: "A ternary inside a ternary hides the branching; an if or a switch expression shows it.", ru: "Тернарный оператор внутри тернарного скрывает ветвление; if или выражение switch его показывают." }
  - id: PRN008
    category: Principles
    title: You are not going to need it
    description: Non-public abstractions with too few implementers, and unused private parameters.
    rationale: Generality that nothing uses.
    paradigms: []
    severity: minor
    confidence: low
    threshold: {}
    l10n:
      ru:
        title: "Тебе это не понадобится (YAGNI)"
        description: "Непубличные абстракции со слишком малым числом реализаций и неиспользуемые параметры закрытых методов."
        rationale: "Обобщённость, которой никто не пользуется."
    messages:
      implementers: { text: "{0} has {1} implementer(s)", ru: "У {0} {1} {1|реализация|реализации|реализаций}" }
      indirection: { text: "A non-public abstraction with at most one implementation adds indirection without a second use. It may still serve test doubles, which this analysis cannot see.", ru: "Непубличная абстракция не более чем с одной реализацией добавляет косвенность без второго применения. Она всё же может служить тестовым дублёрам, которых этот анализ не видит." }
      parameter: { text: "Parameter {0} of {1} is never used", ru: "Параметр {0} в {1} нигде не используется" }
      private: { text: "The method is private, so no external contract requires this parameter.", ru: "Метод закрытый, поэтому никакой внешний контракт не требует этого параметра." }
  - id: PRN009
    category: Principles
    title: Law of Demeter
    description: Call chains that walk through several distinct project types.
    rationale: The caller is coupled to the internal structure of other types.
    paradigms: [oop]
    severity: minor
    confidence: low
    threshold: { maxHops: 2 }
    needsSemantic: true
    l10n:
      ru:
        title: "Закон Деметры (Law of Demeter)"
        description: "Цепочки вызовов, которые проходят через несколько разных типов проекта."
        rationale: "Вызывающий привязан к внутреннему устройству других типов."
    messages:
      chain: { text: "Chain crosses {0} project types", ru: "Цепочка проходит через {0} {0|тип|типа|типов} проекта" }
      navigates: { text: "The call site navigates {0}. Asking the first object for what is needed hides that structure.", ru: "Место вызова проходит по {0}. Если попросить у первого объекта то, что нужно, эта структура будет скрыта." }
